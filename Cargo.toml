[package]
name = "pjournal"
version = "0.4.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
unicode-width = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
md5 = "0.8"
base64 = "0.22"
quick-xml = { version = "0.37", features = ["serialize"] }
rand = "0.8"
ratatui-markdown = { version = "0.3", default-features = false, features = ["markdown"] }
textwrap = "0.16"
dirs = "6"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
